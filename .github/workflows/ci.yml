name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run test
        env:
          WGN_ENV: testing
      - run: bun run build
        env:
          WGN_ENV: staging
          WGN_FORMS_MODE: fixture
          WGN_CHAT_MODE: fixture

  browser-qa:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
        env:
          WGN_ENV: staging
          WGN_FORMS_MODE: fixture
          WGN_CHAT_MODE: fixture
      - run: bun run test:e2e
        env:
          WGN_ENV: staging
          WGN_FORMS_MODE: fixture
          WGN_CHAT_MODE: fixture
